apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  sources:
    # Source 1: Helm chart
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.8.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/platform/apps/observability/values/kube-prometheus-stack.yaml
        parameters:
          - name: crds.enabled
            value: "true"

    # Source 2: Git repo (values + manifests), referenced by $values/
    - repoURL: https://github.com/seekermarcel/Production-Grade-Kubernetes-Platform
      targetRevision: monitoring
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
