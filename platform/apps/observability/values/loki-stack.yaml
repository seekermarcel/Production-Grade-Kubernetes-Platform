loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: false

promtail:
  enabled: true

grafana:
  enabled: false

# Create a Loki datasource ConfigMap in monitoring namespace for Grafana sidecar
datasources:
  enabled: true
  label: grafana_datasource
  labelValue: "1"
  defaultDatasourceEnabled: false
  datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
