controller:
  replicaCount: 1

  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443

  # Kind-specific: ensures it schedules where our port mappings exist
  nodeSelector:
    ingress-ready: "true"

  # Allow scheduling onto the kind control-plane node (tainted NoSchedule)
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    # Some clusters still use the legacy master taint
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  admissionWebhooks:
    enabled: true

  metrics:
    enabled: true

defaultBackend:
  enabled: true
