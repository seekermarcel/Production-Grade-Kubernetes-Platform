controller:
  replicaCount: 1

  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443

  nodeSelector:
    ingress-ready: "true"

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  admissionWebhooks:
    enabled: true

  metrics:
    enabled: true
    # IMPORTANT:
    # Do NOT enable ServiceMonitor here because the CRD isn't installed during bootstrap.
    serviceMonitor:
      enabled: false

defaultBackend:
  enabled: true
